<meta name="claude:viewport-fit-sides" content="cover">
<title>Galaga Arcade by 이광규</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #05060d;
  --fg: #e8f1ff;
  --dim: #6b7a99;
  --line: #1c2340;
  --accent: #ffd23f;
  --cyan: #7ff3ff;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
.wrap { max-width: 480px; margin: 0 auto; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
h1 {
  margin: 0;
  font: 16px/1 "Press Start 2P", monospace;
  color: var(--accent);
  letter-spacing: 0.04em;
}
.btn {
  font: 10px/1 "Press Start 2P", monospace;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
}
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #05060d;
  padding: 14px 20px;
}
.btn.primary:hover { filter: brightness(1.08); }
.stage { margin-top: 12px; }
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 4;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 6px;
  image-rendering: pixelated;
  touch-action: none;
}
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
}
.help {
  margin: 0;
  color: var(--dim);
  font-size: 13px;
  text-align: center;
  text-wrap: balance;
}
</style>

<div class="wrap">
  <header>
    <h1>광-갤러그</h1>
    <button class="btn" id="muteBtn" type="button" aria-pressed="false">SOUND ON</button>
  </header>

  <div class="stage">
    <canvas id="game" width="480" height="640" aria-label="Galaga game screen"></canvas>
  </div>

  <div class="controls">
    <button class="btn primary" id="startBtn" type="button">PRESS START</button>
    <p class="help">← → 이동 · Space 발사 · M 음소거<br>모바일: 화면을 누르고 끌면 이동, 누르고 있으면 연사</p>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   기본 설정
   ============================================================ */
const W = 480, H = 640;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");
const muteBtn = document.getElementById("muteBtn");

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const pad = n => String(n).padStart(6, "0");
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============================================================
   픽셀 아트 스프라이트 (2D 문자 배열 -> 캐시된 캔버스)
   '.' 은 빈 칸, 나머지 문자는 팔레트 색
   ============================================================ */
function makeSprite(rows, pal, scale = 2) {
  const w = Math.max(...rows.map(r => r.length));
  const c = document.createElement("canvas");
  c.width = w * scale;
  c.height = rows.length * scale;
  const g = c.getContext("2d");
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === "." || !pal[ch]) continue;
      g.fillStyle = pal[ch];
      g.fillRect(x * scale, y * scale, scale, scale);
    }
  });
  return { c, w: w * scale, h: rows.length * scale };
}

const BEE_A = [
  "...yyyyy...",
  "..yyyyyyy..",
  ".bbyyyyybb.",
  "bbbywywybbb",
  "bb.yyyyy.bb",
  "b...yyy...b",
  "...y...y...",
  ".y.......y.",
];
const BEE_B = [
  "...yyyyy...",
  "..yyyyyyy..",
  "bbbyyyyybbb",
  ".bbywywybb.",
  "bb.yyyyy.bb",
  "b...yyy...b",
  "y.........y",
  "...........",
];
const BUG_A = [
  "r.........r",
  "rr.......rr",
  "rrrrrwrrrrr",
  "rrrrrwrrrrr",
  ".rrr.w.rrr.",
  "..rr.w.rr..",
  "...r.w.r...",
  "..r.....r..",
];
const BUG_B = [
  "...........",
  "r.........r",
  "rr.......rr",
  "rrrrrwrrrrr",
  ".rrr.w.rrr.",
  "..rr.w.rr..",
  "...r.w.r...",
  "..r.....r..",
];
const BOSS = [
  "ggg.......ggg",
  "ggggg...ggggg",
  "gwgggggggggwg",
  "ggyywwwwwyygg",
  "ggggwrwrwgggg",
  "ggggggggggggg",
  "ggg.ggggg.ggg",
  "gg..ggggg..gg",
  "gg.........gg",
  ".gg.......gg.",
];
const PLAYER = [
  ".....#.....",
  ".....#.....",
  "....###....",
  "....###....",
  "..#######..",
  ".#########.",
  "###.###.###",
  "#####r#####",
  "##.#####.##",
  "#.........#",
];

const SPR = {
  bee: [makeSprite(BEE_A, { y: "#ffd23f", b: "#3aa0ff", w: "#ffffff" }),
        makeSprite(BEE_B, { y: "#ffd23f", b: "#3aa0ff", w: "#ffffff" })],
  bug: [makeSprite(BUG_A, { r: "#ff4d6d", w: "#ffe3ea" }),
        makeSprite(BUG_B, { r: "#ff4d6d", w: "#ffe3ea" })],
  boss: makeSprite(BOSS, { g: "#3ddc84", w: "#eafff3", y: "#ffe066", r: "#ff4d6d" }),
  player: makeSprite(PLAYER, { "#": "#e8f1ff", r: "#ff3b5c" }),
  captive: makeSprite(PLAYER, { "#": "#7ff3ff", r: "#2ad4ff" }),
};
const EXPLODE_COLORS = {
  bee: ["#ffd23f", "#3aa0ff", "#ffffff"],
  bug: ["#ff4d6d", "#ffb3c1", "#ffffff"],
  boss: ["#3ddc84", "#ffe066", "#ffffff"],
  player: ["#ff8a3d", "#ffd23f", "#ffffff"],
};
const BASE_POINTS = { bee: 50, bug: 80, boss: 150 };

function drawSpr(spr, x, y, scale = 1, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(spr.c, Math.round(x - (spr.w * scale) / 2), Math.round(y - (spr.h * scale) / 2),
    spr.w * scale, spr.h * scale);
  ctx.globalAlpha = 1;
}

/* ============================================================
   패럴랙스 별 (3겹, 서로 다른 속도)
   ============================================================ */
const LAYERS = [
  { speed: 18,  color: "#4a5878", size: 1, count: 70 },
  { speed: 48,  color: "#8fa6d6", size: 1, count: 45 },
  { speed: 110, color: "#ffffff", size: 2, count: 22 },
];
const stars = [];
LAYERS.forEach((L, li) => {
  for (let i = 0; i < L.count; i++) stars.push({ li, x: Math.random() * W, y: Math.random() * H });
});
function updateStars(dt) {
  for (const s of stars) {
    s.y += LAYERS[s.li].speed * dt;
    if (s.y > H) { s.y -= H; s.x = Math.random() * W; }
  }
}
function drawStars() {
  for (const s of stars) {
    const L = LAYERS[s.li];
    ctx.fillStyle = L.color;
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), L.size, L.size);
  }
}

/* ============================================================
   사운드 (Web Audio API로 8비트 음 합성)
   ============================================================ */
let AC = null, master = null, noiseBuf = null;
let muted = false;

function ensureAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.22;
    master.connect(AC.destination);
    const len = Math.floor(AC.sampleRate * 0.6);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) {
    AC = null;
  }
}
function tone(f, dur, type = "square", vol = 0.2, when = 0, slideTo = 0) {
  if (!AC || f <= 0) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slideTo > 0) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(master);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}
function noise(dur, vol = 0.3, when = 0, cutoff = 1000) {
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.setValueAtTime(cutoff, t0);
  f.frequency.exponentialRampToValueAtTime(120, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f);
  f.connect(g);
  g.connect(master);
  src.start(t0);
  src.stop(t0 + dur + 0.05);
}
const sfx = {
  shoot() { tone(960, 0.09, "square", 0.12, 0, 240); },
  enemyShot() { tone(520, 0.08, "square", 0.05, 0, 300); },
  explode() { noise(0.42, 0.5, 0, 1400); tone(140, 0.3, "sawtooth", 0.14, 0, 35); },
  hit() { noise(0.7, 0.7, 0, 700); tone(110, 0.5, "square", 0.18, 0, 30); },
  tractor() { tone(180, 1.1, "sawtooth", 0.1, 0, 640); tone(360, 1.1, "triangle", 0.05, 0, 760); },
  rescue() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.13, "square", 0.14, i * 0.09)); },
  start() {
    const m = [[523, .14], [0, .03], [523, .14], [0, .14], [659, .14], [0, .04],
               [784, .14], [0, .14], [659, .14], [523, .14], [784, .14], [1047, .4]];
    let w = 0;
    for (const [f, d] of m) { tone(f, d * 0.95, "square", 0.13, w); w += d; }
  },
  over() { [392, 349, 330, 262].forEach((f, i) => tone(f, 0.3, "square", 0.16, i * 0.28, f * 0.97)); },
};

function setMute(m) {
  muted = m;
  if (master) master.gain.value = m ? 0 : 0.22;
  muteBtn.textContent = m ? "SOUND OFF" : "SOUND ON";
  muteBtn.setAttribute("aria-pressed", String(m));
}
function toggleMute() { setMute(!muted); }

/* ============================================================
   저장 (최고 점수)
   ============================================================ */
function loadHi() {
  try { return Number(localStorage.getItem("galaga-hi")) || 0; } catch (e) { return 0; }
}
function saveHi() {
  try { localStorage.setItem("galaga-hi", String(S.hi)); } catch (e) { /* 저장 불가 환경 */ }
}

/* ============================================================
   게임 상태
   ============================================================ */
const S = { state: "title", t: 0, timer: 0, score: 0, hi: loadHi(), stage: 1, ships: 3, bonus: false };
const ptr = { down: false, x: W / 2 };
const keys = {};
const shk = { t: 0, m: 0 };

let player = newPlayer();
let enemies = [];
let pBullets = [];
let eBullets = [];
let particles = [];
let texts = [];
let diveCD = 0, beamCD = 0;

function newPlayer() {
  return {
    mode: "active", x: W / 2, y: H - 56, dual: false, pendingDual: false,
    invuln: 1.5, cd: 0, timer: 0, capBoss: null, capFromX: W / 2, capFromY: H - 56,
  };
}
function respawn() {
  player.mode = "active";
  player.x = W / 2;
  player.y = H - 56;
  player.invuln = 2;
  player.cd = 0;
  player.dual = player.pendingDual;
  player.pendingDual = false;
}
function shake(m, d) {
  shk.m = Math.max(shk.m, m);
  shk.t = Math.max(shk.t, d);
}
function burst(x, y, colors, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rnd(0.3, 1) * speed;
    const life = rnd(0.35, 0.85);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life, c: colors[i % colors.length] });
  }
}
function popText(x, y, s, c = "#ffffff") {
  texts.push({ x, y, s, c, t: 0.9 });
}
function addScore(p) {
  S.score += p;
  if (S.score > S.hi) S.hi = S.score;
  if (!S.bonus && S.score >= 20000) {
    S.bonus = true;
    S.ships++;
    popText(W / 2, H - 90, "1UP BONUS", "#7ff3ff");
    sfx.rescue();
  }
}

/* ============================================================
   편대 (대열) & 경로
   ============================================================ */
const CW = 34, RH = 30, FORM_Y = 112;
const FORM_SLOTS = [];
[2, 3, 6, 7].forEach(c => FORM_SLOTS.push({ r: 0, c, type: "boss" }));
for (let c = 1; c <= 8; c++) FORM_SLOTS.push({ r: 1, c, type: "bug" });
for (let c = 0; c <= 9; c++) FORM_SLOTS.push({ r: 2, c, type: "bee" });
for (let c = 0; c <= 9; c++) FORM_SLOTS.push({ r: 3, c, type: "bee" });

function bez(P, t) {
  const u = 1 - t;
  const a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return {
    x: a * P[0].x + b * P[1].x + c * P[2].x + d * P[3].x,
    y: a * P[0].y + b * P[1].y + c * P[2].y + d * P[3].y,
  };
}
// 화면 밖 -> 대열 자리까지 곡선 진입
function makePath(sx, sy, hx, hy, dur) {
  const left = sx < W / 2;
  return {
    t: 0, dur,
    P: [
      { x: sx, y: sy },
      { x: left ? W * 0.92 : W * 0.08, y: H * 0.5 },
      { x: hx + (left ? -130 : 130), y: hy - 170 },
      { x: hx, y: hy },
    ],
  };
}
// 대열 -> 플레이어를 향한 다이빙 곡선
function makeDivePath(e) {
  const px = player.x;
  return {
    t: 0,
    dur: Math.max(1.1, rnd(1.5, 2.0) - S.stage * 0.05),
    P: [
      { x: e.x, y: e.y },
      { x: e.x + rnd(-170, 170), y: e.y + rnd(80, 140) },
      { x: px + rnd(-50, 50), y: H * 0.55 + rnd(0, 70) },
      { x: px + rnd(-30, 30), y: H + 70 },
    ],
  };
}

function spawnFormation() {
  enemies = [];
  const bosses = FORM_SLOTS.filter(s => s.type === "boss");
  const others = shuffle(FORM_SLOTS.filter(s => s.type !== "boss"));
  // 스테이지가 올라갈수록 대열 인원이 늘어납니다 (최대 32기)
  const nOthers = Math.min(others.length, 12 + 4 * S.stage);
  const chosen = [...bosses, ...others.slice(0, nOthers)];
  chosen.forEach((s, i) => {
    const hx = W / 2 + (s.c - 4.5) * CW;
    const hy = FORM_Y + s.r * RH;
    const sx = i % 2 ? W + 30 : -30;
    const sy = 60 + Math.random() * 90;
    enemies.push({
      type: s.type, hx, hy,
      x: sx, y: sy,
      state: "enter",
      delay: i * 0.07,
      pt: makePath(sx, sy, hx, hy, rnd(2.0, 2.4)),
      captive: false, beam: null, fireCD: 0, dead: false,
    });
  });
}

function launchDives(n) {
  const pool = enemies.filter(e => e.state === "form");
  for (let k = 0; k < n && pool.length; k++) {
    let idx;
    const capIdx = pool.findIndex(e => e.type === "boss" && e.captive);
    // 아군을 잡아 둔 보스는 우선적으로 다이빙합니다
    if (capIdx >= 0 && Math.random() < 0.7) idx = capIdx;
    else idx = Math.floor(Math.random() * pool.length);
    const e = pool.splice(idx, 1)[0];
    e.state = "dive";
    e.beam = null;
    e.pt = makeDivePath(e);
    e.fireCD = rnd(0.4, 1.0);
  }
}

function fireAt(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const len = Math.hypot(dx, dy) || 1;
  const sp = 190 + S.stage * 10;
  eBullets.push({ x: e.x, y: e.y + 8, vx: dx / len * sp, vy: dy / len * sp, dead: false });
  sfx.enemyShot();
}

/* ============================================================
   업데이트
   ============================================================ */
function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.state === "enter" || e.state === "ret") {
      if (e.delay > 0) {
        e.delay -= dt;
        e.x = e.pt.P[0].x; e.y = e.pt.P[0].y;
        continue;
      }
      e.pt.t = Math.min(1, e.pt.t + dt / e.pt.dur);
      const p = bez(e.pt.P, e.pt.t);
      e.x = p.x; e.y = p.y;
      if (e.pt.t >= 1) e.state = "form";
    } else if (e.state === "form") {
      e.x = e.hx + Math.sin(S.t * 1.7 + e.hy * 0.03) * 10;   // 숨 쉬듯 좌우로
      e.y = e.hy + Math.sin(S.t * 1.1 + e.hx * 0.02) * 2;
    } else if (e.state === "dive") {
      e.pt.t = Math.min(1, e.pt.t + dt / e.pt.dur);
      const p = bez(e.pt.P, e.pt.t);
      e.x = p.x; e.y = p.y;
      e.fireCD -= dt;
      if (e.fireCD <= 0 && e.y > 40 && e.y < H - 120) {
        fireAt(e);
        e.fireCD = rnd(0.9, 1.6);
      }
      if (e.pt.t >= 1) {
        // 화면 아래로 빠진 뒤 위에서 다시 진입해 대열로 복귀
        e.state = "ret";
        e.delay = 0;
        e.pt = makePath(rnd(0, W), -40, e.hx, e.hy, 2.0);
      }
    }
  }
}

function updateBeams(dt) {
  for (const e of enemies) {
    if (e.type !== "boss" || !e.beam) continue;
    e.beam.t += dt;
    if (e.state !== "form") { e.beam = null; continue; }
    if (e.beam.t > 0.8 && player.mode === "active" && Math.abs(player.x - e.x) < 24) {
      capture(e);
      return;
    }
    if (e.beam.t > 2.6) e.beam = null;
  }
}

function capture(boss) {
  boss.beam = null;
  boss.captive = true;
  player.capBoss = boss;
  player.capFromX = player.x;
  player.capFromY = player.y;
  loseShip("capture");
  shake(4, 0.3);
}

function loseShip(kind) {
  S.ships--;
  player.dual = false;
  if (kind === "hit") {
    player.mode = "dead";
    player.timer = 1.3;
    burst(player.x, player.y, EXPLODE_COLORS.player, 34, 210);
    shake(8, 0.45);
    sfx.explode();
  } else {
    player.mode = "capture";
    player.timer = 0.9;
    sfx.tractor();
  }
}

function playerHit() {
  if (player.mode !== "active" || player.invuln > 0) return;
  if (player.dual) {
    // 듀얼 상태에서는 한 기만 격추되고 단일 기체로 돌아갑니다
    player.dual = false;
    player.invuln = 1.5;
    burst(player.x, player.y, EXPLODE_COLORS.player, 14, 140);
    shake(3, 0.2);
    sfx.hit();
  } else {
    loseShip("hit");
  }
}

function rescue(x, y) {
  sfx.rescue();
  popText(x, y, "RESCUE!", "#7ff3ff");
  burst(x, y, ["#7ff3ff", "#ffffff"], 20, 160);
  if (player.mode === "active") player.dual = true;
  else player.pendingDual = true;
}

function killEnemy(e, byPlayer) {
  if (e.dead) return;
  e.dead = true;
  const diving = e.state === "dive" || e.state === "ret";
  const pts = BASE_POINTS[e.type] * (diving ? 2 : 1);
  if (byPlayer) {
    addScore(pts);
    popText(e.x, e.y - 8, "+" + pts);
  }
  burst(e.x, e.y, EXPLODE_COLORS[e.type], 26, 170);
  sfx.explode();
  shake(2.5, 0.15);
  if (e.type === "boss") {
    e.beam = null;
    if (e.captive) {
      // 다이빙 중인 보스를 격추하면 아군 기체 구출 -> 듀얼 파이터
      if (e.state === "dive" && byPlayer) rescue(e.x, e.y);
      else popText(e.x, e.y - 12, "LOST", "#ff8a3d");
      e.captive = false;
    }
  }
}

function tryFire() {
  if (player.cd > 0) return;
  const offs = player.dual ? [-15, 15] : [0];
  const limit = player.dual ? 6 : 3;          // 화면 내 플레이어 미사일 상한
  if (pBullets.length + offs.length > limit) return;
  for (const o of offs) pBullets.push({ x: player.x + o, y: player.y - 12, dead: false });
  player.cd = 0.22;
  sfx.shoot();
}

function updatePlayer(dt, canFire) {
  const p = player;
  if (p.mode === "active") {
    let dir = 0;
    if (keys.ArrowLeft) dir -= 1;
    if (keys.ArrowRight) dir += 1;
    if (ptr.down && Math.abs(ptr.x - p.x) > 3) dir = Math.sign(ptr.x - p.x);
    p.x = clamp(p.x + dir * 230 * dt, 18, W - 18);
    p.cd -= dt;
    p.invuln -= dt;
    if (canFire && (keys.Space || ptr.down)) tryFire();
  } else if (p.mode === "capture") {
    p.timer -= dt;
    const k = ease(1 - clamp(p.timer / 0.9, 0, 1));
    const b = p.capBoss;
    p.x = lerp(p.capFromX, b.x, k);
    p.y = lerp(p.capFromY, b.y + 16, k);
    if (p.timer <= 0) { p.mode = "dead"; p.timer = 1.0; }
  } else if (p.mode === "dead") {
    p.timer -= dt;
    if (p.timer <= 0) {
      if (S.ships > 0) respawn();          // 잔여 목숨이 있으면 다음 기체 출격
      else { p.mode = "gone"; p.timer = 1.2; }
    }
  } else if (p.mode === "gone") {
    p.timer -= dt;
    if (p.timer <= 0) gameOver();
  }
}

function updateBullets(dt) {
  for (const b of pBullets) { b.y -= 540 * dt; if (b.y < -10) b.dead = true; }
  for (const b of eBullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y > H + 10 || b.y < -10 || b.x < -10 || b.x > W + 10) b.dead = true;
  }
  pBullets = pBullets.filter(b => !b.dead);
  eBullets = eBullets.filter(b => !b.dead);
}

function scheduleAttacks(dt) {
  // 다이빙: 스테이지가 오를수록 자주, 한 번에 더 많이 (1~3기)
  diveCD -= dt;
  if (diveCD <= 0) {
    const maxN = Math.min(3, 1 + Math.floor(S.stage / 2));
    launchDives(1 + Math.floor(Math.random() * maxN));
    diveCD = Math.max(0.9, 2.8 - S.stage * 0.25) * rnd(0.7, 1.3);
  }
  // 트랙터 빔: 대열의 보스가 가끔 쏩니다
  beamCD -= dt;
  if (beamCD <= 0) {
    const bosses = enemies.filter(e => e.type === "boss" && e.state === "form" && !e.captive && !e.beam);
    if (bosses.length) {
      const b = bosses[Math.floor(Math.random() * bosses.length)];
      b.beam = { t: 0 };
      sfx.tractor();
    }
    beamCD = Math.max(3.5, 7 - S.stage * 0.5) * rnd(0.8, 1.2);
  }
}

function checkCollisions() {
  // 플레이어 미사일 -> 적
  for (const b of pBullets) {
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.abs(b.x - e.x) < 12 && Math.abs(b.y - e.y) < 10) {
        b.dead = true;
        killEnemy(e, true);
        break;
      }
    }
  }
  // 적 미사일 & 다이빙 적 -> 플레이어
  if (player.mode === "active" && player.invuln <= 0) {
    for (const b of eBullets) {
      if (Math.abs(b.x - player.x) < 9 && Math.abs(b.y - player.y) < 10) {
        b.dead = true;
        playerHit();
        break;
      }
    }
    for (const e of enemies) {
      if (e.dead || e.state !== "dive") continue;
      if (Math.abs(e.x - player.x) < 16 && Math.abs(e.y - player.y) < 14) {
        killEnemy(e, false);
        playerHit();
        break;
      }
    }
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}
function updateTexts(dt) {
  for (const t of texts) { t.t -= dt; t.y -= 28 * dt; }
  texts = texts.filter(t => t.t > 0);
}

function resetGame() {
  S.score = 0;
  S.ships = 3;
  S.stage = 1;
  S.bonus = false;
  player = newPlayer();
  pBullets = [];
  eBullets = [];
  particles = [];
  texts = [];
}

function startStage(n) {
  S.stage = n;
  S.state = "intro";
  S.timer = 2.6;
  pBullets = [];
  eBullets = [];
  spawnFormation();
  diveCD = 3.0;
  beamCD = 5.0;
  sfx.start();
  syncUI();
}

function startGame() {
  if (S.state !== "title" && S.state !== "over") return;
  ensureAudio();
  resetGame();
  startStage(1);
}

function gameOver() {
  if (S.state === "over") return;
  S.state = "over";
  sfx.over();
  saveHi();
  syncUI();
}

function syncUI() {
  const show = S.state === "title" || S.state === "over";
  startBtn.hidden = !show;
  startBtn.textContent = S.state === "over" ? "RESTART" : "PRESS START";
}

function update(dt) {
  S.t += dt;
  updateStars(dt);
  updateParticles(dt);
  updateTexts(dt);
  if (shk.t > 0) { shk.t -= dt; if (shk.t <= 0) shk.m = 0; }

  if (S.state === "title" || S.state === "over") return;

  if (S.state === "intro") {
    S.timer -= dt;
    updatePlayer(dt, false);
    updateEnemies(dt);
    if (S.timer <= 0) S.state = "play";
  } else if (S.state === "play") {
    updatePlayer(dt, true);
    if (S.state !== "play") return;
    updateEnemies(dt);
    updateBeams(dt);
    if (S.state !== "play") return;
    scheduleAttacks(dt);
    updateBullets(dt);
    checkCollisions();
    enemies = enemies.filter(e => !e.dead);
    if (S.state === "play" && enemies.length === 0) {
      S.state = "clear";
      S.timer = 2.6;
      sfx.rescue();
    }
  } else if (S.state === "clear") {
    S.timer -= dt;
    updatePlayer(dt, false);
    updateBullets(dt);
    if (S.timer <= 0 && S.state === "clear") startStage(S.stage + 1);
  }
}

/* ============================================================
   렌더링
   ============================================================ */
function txt(s, x, y, size, color, align = "left", base = "top") {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  ctx.fillText(s, x, y);
}

function drawEnemies() {
  const frame = Math.floor(S.t * 4) % 2;
  for (const e of enemies) {
    if (e.type === "boss") {
      if (e.captive) drawSpr(SPR.captive, e.x, e.y - 16, 0.7, 0.95);  // 포획된 아군
      drawSpr(SPR.boss, e.x, e.y);
    } else if (e.type === "bee") {
      drawSpr(SPR.bee[frame], e.x, e.y);
    } else {
      drawSpr(SPR.bug[frame], e.x, e.y);
    }
  }
  // 다이빙 중에는 적 머리 위에 작은 표시
  ctx.globalAlpha = 1;
}

function drawBeams() {
  for (const e of enemies) {
    if (!e.beam || e.state !== "form") continue;
    const k = Math.min(1, e.beam.t / 0.5);
    const hw = 26 * k;
    const top = e.y + 12;
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, "rgba(127,243,255,0.7)");
    g.addColorStop(1, "rgba(127,243,255,0.04)");
    ctx.fillStyle = g;
    ctx.fillRect(e.x - hw, top, hw * 2, H - top);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (let y = top + ((S.t * 60) % 10); y < H; y += 10) ctx.fillRect(e.x - hw, y, hw * 2, 1);
  }
}

function drawPlayer() {
  const p = player;
  if (p.mode === "active") {
    const blink = p.invuln > 0 && Math.floor(S.t * 12) % 2 === 0;
    if (blink) return;
    if (p.dual) {
      drawSpr(SPR.player, p.x - 15, p.y);
      drawSpr(SPR.player, p.x + 15, p.y);
    } else {
      drawSpr(SPR.player, p.x, p.y);
    }
  } else if (p.mode === "capture") {
    const k = 1 - clamp(p.timer / 0.9, 0, 1);
    drawSpr(SPR.player, p.x, p.y, 1 - 0.4 * k);
  }
}

function drawBullets() {
  ctx.fillStyle = "#ffffff";
  for (const b of pBullets) ctx.fillRect(b.x - 1, b.y - 5, 2, 10);
  ctx.fillStyle = "#ff8a3d";
  for (const b of eBullets) ctx.fillRect(b.x - 1.5, b.y - 3, 3, 6);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  for (const t of texts) {
    txt(t.s, t.x, t.y, 9, t.c, "center", "middle");
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  txt("SCORE", 12, 10, 9, "#ff4d6d");
  txt(pad(S.score), 12, 26, 11, "#ffffff");
  txt("HIGH SCORE", W / 2, 10, 9, "#ff4d6d", "center");
  txt(pad(Math.max(S.hi, S.score)), W / 2, 26, 11, "#ffffff", "center");
  txt("STAGE " + S.stage, W - 12, 10, 9, "#7ff3ff", "right");
  // 남은 목숨 아이콘 (출격 대기 중인 기체)
  const reserves = Math.max(0, S.ships - 1);
  for (let i = 0; i < Math.min(reserves, 8); i++) {
    drawSpr(SPR.player, 16 + i * 18, H - 16, 0.55);
  }
  if (reserves === 0 && S.state !== "title") {
    txt("LAST SHIP", 12, H - 24, 7, "#ff8a3d");
  }
}

function drawOverlay() {
  const blink = Math.floor(S.t * 2.5) % 2 === 0;
  if (S.state === "title") {
    ctx.fillStyle = "rgba(2,3,10,0.4)";
    ctx.fillRect(0, 0, W, H);
    ctx.shadowColor = "#ff3b5c";
    ctx.shadowBlur = 18;
    txt("광-갤러그", W / 2, 190, 44, "#ffd23f", "center", "middle");
    ctx.shadowBlur = 0;
    drawSpr(SPR.boss, W / 2, 262, 1.4);
    drawSpr(SPR.bug[0], W / 2 - 60, 318, 1.3);
    drawSpr(SPR.bee[0], W / 2 + 60, 318, 1.3);
    if (blink) txt("PRESS START", W / 2, 370, 14, "#ffffff", "center", "middle");
    txt("ARROWS MOVE   SPACE FIRE", W / 2, 430, 9, "#7ff3ff", "center", "middle");
    txt("DIVE - TRACTOR BEAM - DUAL FIGHTER", W / 2, 456, 7, "#6b7a99", "center", "middle");
    txt("HIGH SCORE  " + pad(S.hi), W / 2, 506, 10, "#ff8a3d", "center", "middle");
  } else if (S.state === "intro") {
    txt("STAGE " + S.stage, W / 2, 300, 18, "#7ff3ff", "center", "middle");
  } else if (S.state === "clear") {
    txt("STAGE CLEAR", W / 2, 300, 18, "#3ddc84", "center", "middle");
  } else if (S.state === "over") {
    ctx.fillStyle = "rgba(2,3,10,0.6)";
    ctx.fillRect(0, 0, W, H);
    txt("GAME OVER", W / 2, 250, 26, "#ff3b5c", "center", "middle");
    txt("SCORE  " + pad(S.score), W / 2, 310, 11, "#ffffff", "center", "middle");
    txt("HIGH SCORE  " + pad(S.hi), W / 2, 340, 11, "#ff8a3d", "center", "middle");
    if (blink) txt("ENTER / RESTART", W / 2, 400, 11, "#ffd23f", "center", "middle");
  }
}

function render() {
  ctx.save();
  if (shk.t > 0) ctx.translate(rnd(-shk.m, shk.m), rnd(-shk.m, shk.m));
  ctx.fillStyle = "#02030a";
  ctx.fillRect(-20, -20, W + 40, H + 40);
  drawStars();
  if (S.state !== "title") {
    drawBeams();
    drawEnemies();
    drawPlayer();
    drawBullets();
    drawParticles();
    drawTexts();
  }
  drawHUD();
  drawOverlay();
  ctx.restore();
}

/* ============================================================
   입력 (키보드 · 마우스 · 터치)
   ============================================================ */
addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  ensureAudio();
  if (!e.repeat && (e.code === "Enter" || e.code === "Space") && (S.state === "title" || S.state === "over")) {
    startGame();
  }
  if (!e.repeat && e.code === "KeyM") toggleMute();
});
addEventListener("keyup", e => { keys[e.code] = false; });

function pointerX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
canvas.addEventListener("pointerdown", e => {
  ensureAudio();
  if (S.state === "title" || S.state === "over") startGame();
  ptr.down = true;
  ptr.x = pointerX(e);
});
canvas.addEventListener("pointermove", e => { if (ptr.down) ptr.x = pointerX(e); });
const endPointer = () => { ptr.down = false; };
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", endPointer);

startBtn.addEventListener("click", () => {
  ensureAudio();
  startGame();
  startBtn.blur();
});
muteBtn.addEventListener("click", () => {
  ensureAudio();
  toggleMute();
  muteBtn.blur();
});

/* ============================================================
   메인 루프
   ============================================================ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
setMute(false);
syncUI();
requestAnimationFrame(frame);
</script>
